<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Monthsary Book</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Lora:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
  <style>
  html, body { height: 100%; margin: 0; overflow: hidden; }

  .book-wrapper {
    perspective: 1800px;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .book {
    position: relative;
    width: 680px;
    height: 520px;
    transform-style: preserve-3d;
  }

  .page {
    position: absolute;
    width: 50%;
    height: 100%;
    top: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
    z-index: 1;
    left: 50%;
  }

  .page.flipped {
    transform: rotateY(-180deg);
    z-index: 10;
  }

  .page-front, .page-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 0 8px 8px 0;
    overflow: hidden;
    box-shadow: 2px 2px 12px rgba(0,0,0,0.08);
  }

  .page-back {
    transform: rotateY(180deg);
    border-radius: 8px 0 0 8px;
  }

  .left-page {
    position: absolute;
    width: 50%;
    height: 100%;
    top: 0;
    left: 0;
    border-radius: 8px 0 0 8px;
    overflow: hidden;
    box-shadow: -2px 2px 12px rgba(0,0,0,0.08);
  }

  /* Watercolor background */
  .watercolor-bg {
    background: linear-gradient(135deg, #fef7f0 0%, #fdf2f8 30%, #fef3e7 60%, #f8f0ff 100%);
  }

  .watercolor-bg-alt {
    background: linear-gradient(225deg, #f0f7fe 0%, #fdf2f8 40%, #fef7f0 70%, #f0fef4 100%);
  }

  /* Washi tape */
  .washi {
    position: absolute;
    width: 120px;
    height: 28px;
    opacity: 0.7;
    border-radius: 2px;
  }
  .washi-pink { background: repeating-linear-gradient(45deg, #f9a8d4, #f9a8d4 4px, #fbcfe8 4px, #fbcfe8 8px); }
  .washi-mint { background: repeating-linear-gradient(-45deg, #a7f3d0, #a7f3d0 4px, #d1fae5 4px, #d1fae5 8px); }
  .washi-lavender { background: repeating-linear-gradient(45deg, #c4b5fd, #c4b5fd 4px, #ddd6fe 4px, #ddd6fe 8px); }
  .washi-peach { background: repeating-linear-gradient(-45deg, #fdba74, #fdba74 4px, #fed7aa 4px, #fed7aa 8px); }
  .washi-blue { background: repeating-linear-gradient(45deg, #93c5fd, #93c5fd 4px, #bfdbfe 4px, #bfdbfe 8px); }

  /* Polaroid */
  .polaroid {
    background: white;
    padding: 10px 10px 36px 10px;
    box-shadow: 2px 3px 12px rgba(0,0,0,0.1);
    display: inline-block;
  }
  .polaroid-inner {
    width: 140px;
    height: 110px;
    background: linear-gradient(135deg, #e8d5c4, #f5e6d8, #e0cfc0);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .polaroid-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Floral corners as SVG */
  .floral-tl, .floral-br, .floral-tr, .floral-bl {
    position: absolute;
    width: 70px;
    height: 70px;
    opacity: 0.3;
    pointer-events: none;
  }
  .floral-tl { top: 8px; left: 8px; }
  .floral-br { bottom: 8px; right: 8px; transform: rotate(180deg); }
  .floral-tr { top: 8px; right: 8px; transform: scaleX(-1); }
  .floral-bl { bottom: 8px; left: 8px; transform: scaleY(-1); }

  .month-label {
    font-family: 'Caveat', cursive;
    font-size: 14px;
    color: #c084fc;
    letter-spacing: 1px;
  }

  .month-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
  }

  .message-text {
    font-family: 'Lora', serif;
    font-style: italic;
    line-height: 1.7;
    color: #6b5b50;
  }

  .handwritten {
    font-family: 'Caveat', cursive;
  }

  /* Nav buttons */
  .nav-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    border: none;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(4px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .nav-btn:hover { background: #fdf2f8; transform: scale(1.1); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

  /* Cover */
  .cover-left {
    background: linear-gradient(135deg, #fce7f3, #fdf2f8, #f3e8ff);
    border: 3px solid #f9a8d4;
  }

  .page-dots { display: flex; gap: 6px; }
  .page-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #e8d5c4; transition: all 0.3s;
  }
  .page-dot.active { background: #c084fc; transform: scale(1.3); }

  .heart-divider {
    display: flex; align-items: center; gap: 8px;
    opacity: 0.4;
  }
  .heart-divider::before, .heart-divider::after {
    content: ''; flex: 1; height: 1px; background: #d4a0b9;
  }

  @media (max-width: 750px) {
    .book { width: 92%; height: 440px; }
    .polaroid-inner { width: 100px; height: 80px; }
    .polaroid { padding: 7px 7px 28px; }
  }
  @media (max-width: 500px) {
    .book { width: 98%; height: 380px; }
    .message-text { font-size: 12px !important; }
  }
</style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full" style="background: linear-gradient(to bottom, #fef7f0, #fdf2f8, #f8f0ff); font-family: 'Lora', serif;">
  <div class="h-full flex flex-col items-center justify-center p-4">
   <!-- Title -->
   <div class="text-center mb-4">
    <p class="handwritten text-2xl" style="color: #c084fc;" id="book-title">Our Love Story</p>
   </div><!-- Book -->
   <div class="book-wrapper">
    <button class="nav-btn mr-3" id="prev-btn" disabled aria-label="Previous page"> <i data-lucide="chevron-left" style="width:20px;height:20px;color:#a78bfa;"></i> </button>
    <div class="book" id="book">
     <!-- Left static page (visible when book is open) -->
     <div class="left-page watercolor-bg" id="left-page"></div><!-- Pages will be generated by JS -->
    </div><button class="nav-btn ml-3" id="next-btn" aria-label="Next page"> <i data-lucide="chevron-right" style="width:20px;height:20px;color:#a78bfa;"></i> </button>
   </div><!-- Page dots -->
   <div class="page-dots mt-4" id="page-dots"></div>
  </div>
  <script>
const floralSVG = `<svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 5C5 5 15 25 10 40C5 55 25 65 35 55C45 65 65 55 60 40C55 25 65 5 65 5" stroke="#d4a0b9" stroke-width="1" fill="none" opacity="0.5"/>
  <circle cx="20" cy="20" r="6" fill="#fce7f3" opacity="0.6"/>
  <circle cx="50" cy="15" r="5" fill="#f3e8ff" opacity="0.5"/>
  <circle cx="15" cy="45" r="4" fill="#ddd6fe" opacity="0.5"/>
  <path d="M30 10C32 15 28 20 25 18C22 16 27 12 30 10Z" fill="#f9a8d4" opacity="0.4"/>
  <path d="M45 35C48 38 46 44 42 42C38 40 42 36 45 35Z" fill="#c4b5fd" opacity="0.4"/>
</svg>`;

const defaultConfig = {
  month_1: "The day we started this beautiful journey together. Every moment since has been a gift I cherish deeply. Especially achieving milestones together 💕",
  month_2: "Two months with you baby, and my heart only grows fonder. Thank you for your sweetness, your care and for making everyday brighter. I love you more each single day.",
  month_3: "Three months of love and my heart still skips a beat every time I see you. Making you happy during your 25th birthday.",
  month_4: "Four months of building memories I'll treasure forever. A very tough month of saying goodbye together but continuing to grow our relationship even we need to be apart.✨",
  month_5: "Five months of growing closer, understanding deeper, and loving harder.",
  month_6: "Half a year with you! Every day confirms how much I love you, Surprising me 9:00 PM unexpected dawa nag tatampo ako, First Christmas and New Year of being together. 🎄",
  month_7: "Seven months with you and my heart keeps getting more attached to you every day, making hard days feels lighter.",
  month_8: "Eight months with you, a very memorable month for us, surprising you dawa nawara ako sa Sta Ana, and being with you for four days, cooking you with simple food and waiting for you after a long day of work, and wakingup beside you. I love you so much, and I can't wait for more months and years to come. 💖",
  month_9: "Nine months of us. Thank you for being my safe place, my comfort, and my joy, and supporting me when I am doubting myself. Making efforts to lift my mood and support me even when you are also having a hard time. I love you so much, and I am so grateful to have you in my life. 💗",
  month_10: "Ten months with you the hardest month full of self doubts, sleepless nights but you always reminds me that I can make it and your the first one saying that I will be an engineer. Thank you for being my support system, everything I achieve is because of you and it is for our future ahead💖",
  month_11: "Eleven months today, my love. Almost a year of the most beautiful chapter of my life. Celebrating everything with you and solving problems together, growing stronger and making plans for our future. I am so proud to call you mine, I am so lucky to be loved by someone as wonderful, beautiful and genuine as you. 💗",
  month_12: "Here's to our future, to a year, and every year after that, hand in hand together. Forever yours.🌸",
  partner_name: "My Love",
  your_name: "Yours Engr",
  background_color: "#fef7f0",
  surface_color: "#ffffff",
  text_color: "#6b5b50",
  primary_action: "#c084fc",
  secondary_action: "#f9a8d4",
  font_family: "Lora",
  font_size: 14
};

let config = { ...defaultConfig };
let currentSpread = 0;
const totalSpreads = 7;

const monthsWithPhotos = [1, 4];
const washiClasses = ['washi-pink', 'washi-mint', 'washi-lavender', 'washi-peach', 'washi-blue'];


const photoMap = {
  1: {
    photo1: '1.jpg', 
  },
  4: {
    photo1: '2.jpg', 
    photo2: 'We.jpg'
  }
};

function getOrdinal(n) {
  const s = ["th","st","nd","rd"];
  const v = n % 100;
  return n + (s[(v-20)%10]||s[v]||s[0]);
}

function buildPhotoSection(monthNum) {
  if (!monthsWithPhotos.includes(monthNum)) return '';
  
  const photos = photoMap[monthNum] || {
    photo1: 'https://images.unsplash.com/photo-1516062423079-7ca13cdc7f5a?w=200&h=160&fit=crop',
  };

  if (monthNum === 1) {
    return `
      <div class="flex justify-center mb-3">
        <div class="polaroid" style="transform: rotate(-2deg);">
          <div class="polaroid-inner">
            <img src="${photos.photo1}" alt="Month ${monthNum} photo" loading="lazy" onerror="this.style.background='#e8d5c4';">
          </div>
          <p class="handwritten text-center mt-1" style="font-size:11px;color:#b8977e;">Our beginning ♡</p>
        </div>
      </div>`;
  }

  return `
    <div class="flex justify-center gap-3 mb-3">
      <div class="polaroid" style="transform: rotate(-3deg);">
        <div class="polaroid-inner">
          <img src="${photos.photo1}" alt="Month ${monthNum} photo" loading="lazy" onerror="this.style.background='#e8d5c4';">
        </div>
        <p class="handwritten text-center mt-1" style="font-size:11px;color:#b8977e;">Month ${monthNum}</p>
      </div>
      <div class="polaroid" style="transform: rotate(2deg);">
        <div class="polaroid-inner">
          <img src="${photos.photo2}" alt="Month ${monthNum} memory" loading="lazy" onerror="this.style.background='#e8d5c4';">
        </div>
        <p class="handwritten text-center mt-1" style="font-size:11px;color:#b8977e;">Forever ♡</p>
      </div>
    </div>`;
}

function buildMonthPage(monthNum, isLeftSide) {
  const key = `month_${monthNum}`;
  const msg = config[key] || defaultConfig[key];
  const hasPhoto = monthsWithPhotos.includes(monthNum);
  const bgClass = isLeftSide ? 'watercolor-bg' : 'watercolor-bg-alt';
  const washiIdx = (monthNum - 1) % washiClasses.length;
  const washiClass = washiClasses[washiIdx];
  const washiIdx2 = (monthNum) % washiClasses.length;
  const washiClass2 = washiClasses[washiIdx2];
  const radius = isLeftSide ? 'border-radius:8px 0 0 8px;' : 'border-radius:0 8px 8px 0;';

  return `
    <div class="${bgClass} relative flex flex-col justify-center items-center p-6" style="width:100%;height:100%;${radius}">
      <div class="floral-tl">${floralSVG}</div>
      <div class="floral-br">${floralSVG}</div>

      <div class="washi ${washiClass}" style="top:-6px;right:20px;transform:rotate(${-5 + monthNum}deg);"></div>
      <div class="washi ${washiClass2}" style="bottom:-6px;left:15px;transform:rotate(${3 - monthNum}deg);width:90px;height:22px;"></div>

      <p class="month-label mb-1">${getOrdinal(monthNum)} Month</p>
      <h2 class="month-title mb-3" style="font-size:${config.font_size * 1.4}px;color:${config.primary_action};">Month ${monthNum}</h2>

      <div class="heart-divider mb-3" style="width:60%;"><span style="color:${config.secondary_action};">♥</span></div>

      ${hasPhoto ? buildPhotoSection(monthNum) : ''}

      <p class="message-text text-center px-4" style="font-size:${config.font_size}px;color:${config.text_color};font-family:${config.font_family},Lora,serif;max-width:280px;" data-msg="${key}">${msg}</p>

      ${monthNum === 12 ? `<p class="handwritten mt-3" style="font-size:${config.font_size * 1.1}px;color:${config.secondary_action};">With all my love, <span data-field="your_name">${config.your_name}</span> 💌</p>` : ''}
    </div>`;
}

function buildCoverLeft() {
  return `
    <div class="cover-left relative flex flex-col justify-center items-center" style="width:100%;height:100%;border-radius:8px 0 0 8px;">
      <div class="floral-tl">${floralSVG}</div>
      <div class="floral-br">${floralSVG}</div>
      <div class="floral-tr">${floralSVG}</div>
      <div class="floral-bl">${floralSVG}</div>
      <div class="washi washi-pink" style="top:-8px;left:30px;transform:rotate(-8deg);"></div>
      <div class="washi washi-lavender" style="bottom:-8px;right:20px;transform:rotate(5deg);"></div>

      <p class="handwritten text-3xl mb-2" style="color:${config.primary_action};">For</p>
      <h1 class="month-title text-3xl mb-4" style="color:${config.text_color};font-family:${config.font_family},Cormorant Garamond,serif;" data-field="partner_name">${config.partner_name}</h1>
      <div class="heart-divider mb-4" style="width:50%;"><span style="color:${config.secondary_action};font-size:18px;">♥</span></div>
      <p class="handwritten text-xl" style="color:${config.secondary_action};">11 Months of Us</p>
      <p class="handwritten mt-2" style="color:#b8977e;font-size:14px;">A love story, page by page 🌸</p>
    </div>`;
}

function buildCoverRight() {
  return `
    <div class="watercolor-bg-alt relative flex flex-col justify-center items-center" style="width:100%;height:100%;border-radius:0 8px 8px 0;">
      <div class="floral-tl">${floralSVG}</div>
      <div class="floral-br">${floralSVG}</div>
      <div class="washi washi-mint" style="top:-6px;right:25px;transform:rotate(-4deg);"></div>

      <p class="handwritten text-xl mb-3" style="color:${config.primary_action};">✨ Our Journey ✨</p>
      <p class="message-text text-center px-6" style="font-size:${config.font_size}px;color:${config.text_color};max-width:260px;">
        Twelve pages, twelve months, one beautiful love story. Turn the pages to relive every moment...
      </p>
      <p class="handwritten mt-4" style="color:${config.secondary_action};font-size:18px;">→ Turn to begin</p>
    </div>`;
}

function renderBook() {
  const book = document.getElementById('book');
  const leftPage = document.getElementById('left-page');

  book.querySelectorAll('.page').forEach(p => p.remove());

  const spreads = [
    { left: buildCoverLeft, right: buildCoverRight },
  ];
  for (let i = 0; i < 6; i++) {
    const m1 = i * 2 + 1;
    const m2 = i * 2 + 2;
    spreads.push({
      left: () => buildMonthPage(m1, true),
      right: () => buildMonthPage(m2, false)
    });
  }

  for (let i = 0; i < spreads.length; i++) {
    const pageEl = document.createElement('div');
    pageEl.className = 'page' + (i < currentSpread ? ' flipped' : '');
    pageEl.style.zIndex = i < currentSpread ? (10 + i) : (spreads.length - i);
    pageEl.dataset.index = i;

    const front = document.createElement('div');
    front.className = 'page-front';
    front.innerHTML = spreads[i].right();

    const back = document.createElement('div');
    back.className = 'page-back';
    if (i + 1 < spreads.length) {
      back.innerHTML = spreads[i + 1].left();
    } else {
      back.innerHTML = `<div class="watercolor-bg relative flex flex-col justify-center items-center" style="width:100%;height:100%;border-radius:8px 0 0 8px;">
        <div class="floral-tl">${floralSVG}</div>
        <div class="floral-br">${floralSVG}</div>
        <p class="handwritten text-2xl" style="color:${config.primary_action};">The End...</p>
        <p class="handwritten mt-2" style="color:${config.secondary_action};">but our story continues 💕</p>
        <p class="handwritten mt-3" style="color:#b8977e;font-size:14px;">Happy 11th Monthsary!</p>
      </div>`;
    }

    pageEl.appendChild(front);
    pageEl.appendChild(back);
    book.appendChild(pageEl);
  }

  leftPage.innerHTML = spreads[currentSpread].left();
  leftPage.className = 'left-page ' + (currentSpread % 2 === 0 ? 'watercolor-bg' : 'watercolor-bg-alt');

  updateDots();
  updateNavButtons();
}

function updateDots() {
  const dotsEl = document.getElementById('page-dots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < totalSpreads; i++) {
    const dot = document.createElement('div');
    dot.className = 'page-dot' + (i === currentSpread ? ' active' : '');
    dot.style.cursor = 'pointer';
    dot.addEventListener('click', () => goToSpread(i));
    dotsEl.appendChild(dot);
  }
}

function updateNavButtons() {
  document.getElementById('prev-btn').disabled = currentSpread === 0;
  document.getElementById('next-btn').disabled = currentSpread >= totalSpreads - 1;
}

function goToSpread(target) {
  if (target === currentSpread) return;
  const pages = document.querySelectorAll('.page');

  if (target > currentSpread) {
    for (let i = currentSpread; i < target; i++) {
      pages[i].classList.add('flipped');
      pages[i].style.zIndex = 10 + i;
    }
  } else {
    for (let i = currentSpread - 1; i >= target; i--) {
      pages[i].classList.remove('flipped');
      pages[i].style.zIndex = totalSpreads - i;
    }
  }

  currentSpread = target;

  setTimeout(() => {
    const spreadsData = getSpreadsData();
    const leftPage = document.getElementById('left-page');
    leftPage.innerHTML = spreadsData[currentSpread].left();
    updateDots();
    updateNavButtons();
  }, 500);
}

function getSpreadsData() {
  const spreads = [
    { left: buildCoverLeft, right: buildCoverRight },
  ];
  for (let i = 0; i < 6; i++) {
    const m1 = i * 2 + 1;
    const m2 = i * 2 + 2;
    spreads.push({
      left: () => buildMonthPage(m1, true),
      right: () => buildMonthPage(m2, false)
    });
  }
  return spreads;
}

document.getElementById('next-btn').addEventListener('click', () => {
  if (currentSpread < totalSpreads - 1) goToSpread(currentSpread + 1);
});
document.getElementById('prev-btn').addEventListener('click', () => {
  if (currentSpread > 0) goToSpread(currentSpread - 1);
});

function applyConfig(cfg) {
  config = { ...defaultConfig, ...cfg };
  document.body.style.background = `linear-gradient(to bottom, ${config.background_color}, #fdf2f8, #f8f0ff)`;
  document.getElementById('book-title').style.color = config.primary_action;
  document.getElementById('book-title').style.fontFamily = `${config.font_family}, Caveat, cursive`;
  renderBook();
}

function initializeSDK() {
  if (window.elementSdk) {
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (cfg) => applyConfig(cfg),
      mapToCapabilities: (cfg) => ({
        recolorables: [
          { get: () => cfg.background_color || defaultConfig.background_color, set: (v) => { cfg.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
          { get: () => cfg.surface_color || defaultConfig.surface_color, set: (v) => { cfg.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
          { get: () => cfg.text_color || defaultConfig.text_color, set: (v) => { cfg.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
          { get: () => cfg.primary_action || defaultConfig.primary_action, set: (v) => { cfg.primary_action = v; window.elementSdk.setConfig({ primary_action: v }); } },
          { get: () => cfg.secondary_action || defaultConfig.secondary_action, set: (v) => { cfg.secondary_action = v; window.elementSdk.setConfig({ secondary_action: v }); } },
        ],
        borderables: [],
        fontEditable: { get: () => cfg.font_family || defaultConfig.font_family, set: (v) => { cfg.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
        fontSizeable: { get: () => cfg.font_size || defaultConfig.font_size, set: (v) => { cfg.font_size = v; window.elementSdk.setConfig({ font_size: v }); } },
      }),
      mapToEditPanelValues: (cfg) => {
        const m = new Map();
        for (let i = 1; i <= 12; i++) m.set(`month_${i}`, cfg[`month_${i}`] || defaultConfig[`month_${i}`]);
        m.set('partner_name', cfg.partner_name || defaultConfig.partner_name);
        m.set('your_name', cfg.your_name || defaultConfig.your_name);
        return m;
      }
    });
  }
  renderBook();
  lucide.createIcons();
}
